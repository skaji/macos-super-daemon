version: 2

builds:
  - ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}-{{- .Os }}-{{- .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
